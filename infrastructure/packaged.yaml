AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "ResQFlow — Intelligent Event-Driven Emergency Response and Resource
  Orchestration Platform Primary Region: ap-south-2 (Asia Pacific - Hyderabad) Enterprise
  Edition: EventBridge Archive & Replay, SQS Dead-Letter Queues, and AWS X-Ray Tracing\n"
Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.12
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME:
          Ref: IncidentsTable
        EVENT_BUS_NAME:
          Ref: EventBus
        SNS_TOPIC_ARN:
          Ref: AlertsTopic
        DEAD_LETTER_QUEUE_URL:
          Ref: ResQFlowDeadLetterQueue
        APP_REGION:
          Ref: AWS::Region
Resources:
  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ResQFlowIncidents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: incidentId
        AttributeType: S
      - AttributeName: status
        AttributeType: S
      - AttributeName: createdAt
        AttributeType: S
      KeySchema:
      - AttributeName: incidentId
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: StatusCreatedAtIndex
        KeySchema:
        - AttributeName: status
          KeyType: HASH
        - AttributeName: createdAt
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      Tags:
      - Key: Project
        Value: ResQFlow
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: resqflow-event-bus
  ResQFlowEventArchive:
    Type: AWS::Events::Archive
    Properties:
      ArchiveName: ResQFlow-EventArchive
      SourceArn:
        Fn::GetAtt:
        - EventBus
        - Arn
      Description: Comprehensive disaster event audit trail and replay archive
      RetentionDays: 14
  ResQFlowDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ResQFlow-DeadLetterQueue
      MessageRetentionPeriod: 1209600
  ResQFlowDeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
      - Ref: ResQFlowDeadLetterQueue
      PolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: events.amazonaws.com
          Action: sqs:SendMessage
          Resource:
            Fn::GetAtt:
            - ResQFlowDeadLetterQueue
            - Arn
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: ResQFlowAlerts
      DisplayName: ResQFlow Emergency Response Alerts
  ResQFlowAlertAuditQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ResQFlow-AlertAuditQueue
      MessageRetentionPeriod: 1209600
  ResQFlowAlertAuditQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
      - Ref: ResQFlowAlertAuditQueue
      PolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - sns.amazonaws.com
            - events.amazonaws.com
          Action: sqs:SendMessage
          Resource:
            Fn::GetAtt:
            - ResQFlowAlertAuditQueue
            - Arn
  AlertsTopicToAuditQueueSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn:
        Ref: AlertsTopic
      Protocol: sqs
      Endpoint:
        Fn::GetAtt:
        - ResQFlowAlertAuditQueue
        - Arn
      RawMessageDelivery: false
  DispatchTelemetryRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName:
        Ref: EventBus
      Name: ResQFlow-DispatchTelemetryRule
      Description: Captures ResourceAllocated, TeamDispatched, and 
        IncidentResolved domain events
      EventPattern:
        source:
        - resqflow.incident
        detail-type:
        - ResourceAllocated
        - TeamDispatched
        - IncidentResolved
      Targets:
      - Id: DispatchAuditQueueTarget
        Arn:
          Fn::GetAtt:
          - ResQFlowAlertAuditQueue
          - Arn
  ResQFlowHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: ResQFlow-IngestionApi
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      CorsConfiguration:
        AllowOrigins:
        - '*'
        AllowMethods:
        - GET
        - POST
        - OPTIONS
        AllowHeaders:
        - Content-Type
        - Authorization
        - X-Amz-Date
        - X-Api-Key
        - X-Amz-Security-Token
        MaxAge: 600
  IngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ResQFlow-IngestionFunction
      CodeUri: 
        s3://resqflow-deploy-621962614200-ap-south-2/c294be0e7845a46c8e3de64a490e50b9
      Handler: app.lambda_handler
      Description: Ingests emergency incidents, stores in DynamoDB, and emits 
        IncidentReported
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: IncidentsTable
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:Query
          Resource:
            Fn::Sub: ${IncidentsTable.Arn}/index/*
      - EventBridgePutEventsPolicy:
          EventBusName:
            Ref: EventBus
      - SQSSendMessagePolicy:
          QueueName:
            Fn::GetAtt:
            - ResQFlowDeadLetterQueue
            - QueueName
      Events:
        CreateIncident:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ResQFlowHttpApi
            Path: /incidents
            Method: POST
        ListIncidents:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ResQFlowHttpApi
            Path: /incidents
            Method: GET
        GetIncident:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ResQFlowHttpApi
            Path: /incidents/{incidentId}
            Method: GET
        TriggerDrill:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ResQFlowHttpApi
            Path: /incidents/drill
            Method: POST
        ResolveIncident:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ResQFlowHttpApi
            Path: /incidents/{incidentId}/resolve
            Method: POST
  ClassifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ResQFlow-ClassifierFunction
      CodeUri: 
        s3://resqflow-deploy-621962614200-ap-south-2/3afacb8693dcc755ff048613b55b9145
      Handler: app.lambda_handler
      Description: Classifies incident severity deterministically and emits 
        IncidentClassified
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: IncidentsTable
      - EventBridgePutEventsPolicy:
          EventBusName:
            Ref: EventBus
      Events:
        IncidentReportedRule:
          Type: EventBridgeRule
          Properties:
            EventBusName:
              Ref: EventBus
            Pattern:
              source:
              - resqflow.incident
              detail-type:
              - IncidentReported
            DeadLetterConfig:
              Arn:
                Fn::GetAtt:
                - ResQFlowDeadLetterQueue
                - Arn
  ResourceAllocationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ResQFlow-ResourceAllocationFunction
      CodeUri: 
        s3://resqflow-deploy-621962614200-ap-south-2/214e5a7b37d21d16c2bf1b3d67a1e460
      Handler: app.lambda_handler
      Description: Allocates response teams and hospital facilities based on 
        severity
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: IncidentsTable
      - EventBridgePutEventsPolicy:
          EventBusName:
            Ref: EventBus
  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ResQFlow-NotificationFunction
      CodeUri: 
        s3://resqflow-deploy-621962614200-ap-south-2/281769eda92ca589a2e06719628e1997
      Handler: app.lambda_handler
      Description: Dispatches broadcast SMS/Email alerts via Amazon SNS
      Policies:
      - SNSPublishMessagePolicy:
          TopicName:
            Fn::GetAtt:
            - AlertsTopic
            - TopicName
  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: 
          /aws/vendedlogs/states/ResQFlowIncidentWorkflow-${AWS::StackName}
      RetentionInDays: 14
  ResQFlowStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: ResQFlowIncidentWorkflow
      DefinitionUri:
        Bucket: resqflow-deploy-621962614200-ap-south-2
        Key: d14c1184a404c965ca6f28bb4de50a40
      DefinitionSubstitutions:
        ResourceAllocationFunctionArn:
          Fn::GetAtt:
          - ResourceAllocationFunction
          - Arn
        NotificationFunctionArn:
          Fn::GetAtt:
          - NotificationFunction
          - Arn
      Tracing:
        Enabled: true
      Logging:
        Destinations:
        - CloudWatchLogsLogGroup:
            LogGroupArn:
              Fn::GetAtt:
              - StateMachineLogGroup
              - Arn
        IncludeExecutionData: true
        Level: ALL
      Policies:
      - LambdaInvokePolicy:
          FunctionName:
            Ref: ResourceAllocationFunction
      - LambdaInvokePolicy:
          FunctionName:
            Ref: NotificationFunction
      - Statement:
        - Effect: Allow
          Action:
          - logs:CreateLogDelivery
          - logs:CreateLogStream
          - logs:GetLogDelivery
          - logs:UpdateLogDelivery
          - logs:DeleteLogDelivery
          - logs:ListLogDeliveries
          - logs:PutLogEvents
          - logs:PutResourcePolicy
          - logs:DescribeResourcePolicies
          - logs:DescribeLogGroups
          Resource: '*'
      Events:
        IncidentClassifiedRule:
          Type: EventBridgeRule
          Properties:
            EventBusName:
              Ref: EventBus
            Pattern:
              source:
              - resqflow.incident
              detail-type:
              - IncidentClassified
            DeadLetterConfig:
              Arn:
                Fn::GetAtt:
                - ResQFlowDeadLetterQueue
                - Arn
Outputs:
  ApiEndpoint:
    Description: Base HTTP API Endpoint for ResQFlow
    Value:
      Fn::Sub: 
        https://${ResQFlowHttpApi}.execute-api.${AWS::Region}.amazonaws.com
    Export:
      Name: ResQFlow-ApiEndpoint
  IncidentsTableName:
    Description: DynamoDB Table Name
    Value:
      Ref: IncidentsTable
    Export:
      Name: ResQFlow-IncidentsTableName
  EventBusArn:
    Description: ResQFlow Custom EventBus ARN
    Value:
      Fn::GetAtt:
      - EventBus
      - Arn
    Export:
      Name: ResQFlow-EventBusArn
  EventArchiveArn:
    Description: ResQFlow EventBridge Archive ARN
    Value:
      Fn::GetAtt:
      - ResQFlowEventArchive
      - Arn
    Export:
      Name: ResQFlow-EventArchiveArn
  DeadLetterQueueUrl:
    Description: SQS Dead-Letter Queue URL for Circuit Breaker Fault Recovery
    Value:
      Ref: ResQFlowDeadLetterQueue
    Export:
      Name: ResQFlow-DeadLetterQueueUrl
  DeadLetterQueueArn:
    Description: SQS Dead-Letter Queue ARN
    Value:
      Fn::GetAtt:
      - ResQFlowDeadLetterQueue
      - Arn
    Export:
      Name: ResQFlow-DeadLetterQueueArn
  AlertsTopicArn:
    Description: ResQFlow SNS Alerts Topic ARN
    Value:
      Ref: AlertsTopic
    Export:
      Name: ResQFlow-AlertsTopicArn
  AlertAuditQueueUrl:
    Description: SQS Queue URL capturing SNS emergency broadcasts and 
      EventBridge dispatch telemetry
    Value:
      Ref: ResQFlowAlertAuditQueue
    Export:
      Name: ResQFlow-AlertAuditQueueUrl
  AlertAuditQueueArn:
    Description: SQS Queue ARN capturing SNS emergency broadcasts and 
      EventBridge dispatch telemetry
    Value:
      Fn::GetAtt:
      - ResQFlowAlertAuditQueue
      - Arn
    Export:
      Name: ResQFlow-AlertAuditQueueArn
  StateMachineArn:
    Description: ResQFlow Step Functions Orchestrator ARN
    Value:
      Ref: ResQFlowStateMachine
    Export:
      Name: ResQFlow-StateMachineArn
  StateMachineLogGroupArn:
    Description: ResQFlow Step Functions CloudWatch Execution Log Group ARN
    Value:
      Fn::GetAtt:
      - StateMachineLogGroup
      - Arn
    Export:
      Name: ResQFlow-StateMachineLogGroupArn
