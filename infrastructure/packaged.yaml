AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "ResQFlow — Intelligent Event-Driven Emergency Response and Resource
  Orchestration Platform Primary Region: ap-south-2 (Asia Pacific - Hyderabad)\n"
Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.12
    Environment:
      Variables:
        TABLE_NAME:
          Ref: IncidentsTable
        EVENT_BUS_NAME:
          Ref: EventBus
        SNS_TOPIC_ARN:
          Ref: AlertsTopic
        APP_REGION:
          Ref: AWS::Region
Resources:
  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ResQFlowIncidents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: incidentId
        AttributeType: S
      KeySchema:
      - AttributeName: incidentId
        KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      Tags:
      - Key: Project
        Value: ResQFlow
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: resqflow-event-bus
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: ResQFlowAlerts
      DisplayName: ResQFlow Emergency Response Alerts
  ResQFlowHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: ResQFlow-IngestionApi
      CorsConfiguration:
        AllowOrigins:
        - '*'
        AllowMethods:
        - GET
        - POST
        - OPTIONS
        AllowHeaders:
        - Content-Type
        - Authorization
        - X-Amz-Date
        - X-Api-Key
        - X-Amz-Security-Token
        MaxAge: 600
  IngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ResQFlow-IngestionFunction
      CodeUri: 
        s3://resqflow-deploy-621962614200-ap-south-2/7d8add563c106c1bcea15fea5f361e6e
      Handler: app.lambda_handler
      Description: Ingests emergency incidents, stores in DynamoDB, and emits 
        IncidentReported
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: IncidentsTable
      - EventBridgePutEventsPolicy:
          EventBusName:
            Ref: EventBus
      Events:
        CreateIncident:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ResQFlowHttpApi
            Path: /incidents
            Method: POST
        ListIncidents:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ResQFlowHttpApi
            Path: /incidents
            Method: GET
        GetIncident:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ResQFlowHttpApi
            Path: /incidents/{incidentId}
            Method: GET
  ClassifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ResQFlow-ClassifierFunction
      CodeUri: 
        s3://resqflow-deploy-621962614200-ap-south-2/e35019d16270ed76707095d626ec0eea
      Handler: app.lambda_handler
      Description: Classifies incident severity deterministically and emits 
        IncidentClassified
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: IncidentsTable
      - EventBridgePutEventsPolicy:
          EventBusName:
            Ref: EventBus
      Events:
        IncidentReportedRule:
          Type: EventBridgeRule
          Properties:
            EventBusName:
              Ref: EventBus
            Pattern:
              source:
              - resqflow.incident
              detail-type:
              - IncidentReported
  ResourceAllocationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ResQFlow-ResourceAllocationFunction
      CodeUri: 
        s3://resqflow-deploy-621962614200-ap-south-2/bc78783ceaee2281e12d93941ea3b95a
      Handler: app.lambda_handler
      Description: Allocates response teams and hospital facilities based on 
        severity
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: IncidentsTable
      - EventBridgePutEventsPolicy:
          EventBusName:
            Ref: EventBus
  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ResQFlow-NotificationFunction
      CodeUri: 
        s3://resqflow-deploy-621962614200-ap-south-2/f95d6ac477d1a874958ce5ca7e0d1440
      Handler: app.lambda_handler
      Description: Dispatches broadcast SMS/Email alerts via Amazon SNS
      Policies:
      - SNSPublishMessagePolicy:
          TopicName:
            Fn::GetAtt:
            - AlertsTopic
            - TopicName
  ResQFlowStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: ResQFlowIncidentWorkflow
      DefinitionUri:
        Bucket: resqflow-deploy-621962614200-ap-south-2
        Key: d14c1184a404c965ca6f28bb4de50a40
      DefinitionSubstitutions:
        ResourceAllocationFunctionArn:
          Fn::GetAtt:
          - ResourceAllocationFunction
          - Arn
        NotificationFunctionArn:
          Fn::GetAtt:
          - NotificationFunction
          - Arn
      Policies:
      - LambdaInvokePolicy:
          FunctionName:
            Ref: ResourceAllocationFunction
      - LambdaInvokePolicy:
          FunctionName:
            Ref: NotificationFunction
      Events:
        IncidentClassifiedRule:
          Type: EventBridgeRule
          Properties:
            EventBusName:
              Ref: EventBus
            Pattern:
              source:
              - resqflow.incident
              detail-type:
              - IncidentClassified
Outputs:
  ApiEndpoint:
    Description: Base HTTP API Endpoint for ResQFlow
    Value:
      Fn::Sub: 
        https://${ResQFlowHttpApi}.execute-api.${AWS::Region}.amazonaws.com
    Export:
      Name: ResQFlow-ApiEndpoint
  IncidentsTableName:
    Description: DynamoDB Table Name
    Value:
      Ref: IncidentsTable
    Export:
      Name: ResQFlow-IncidentsTableName
  EventBusArn:
    Description: ResQFlow Custom EventBus ARN
    Value:
      Fn::GetAtt:
      - EventBus
      - Arn
    Export:
      Name: ResQFlow-EventBusArn
  AlertsTopicArn:
    Description: ResQFlow SNS Alerts Topic ARN
    Value:
      Ref: AlertsTopic
    Export:
      Name: ResQFlow-AlertsTopicArn
  StateMachineArn:
    Description: ResQFlow Step Functions Orchestrator ARN
    Value:
      Ref: ResQFlowStateMachine
    Export:
      Name: ResQFlow-StateMachineArn
