AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  ResQFlow — Intelligent Event-Driven Emergency Response and Resource Orchestration Platform
  Primary Region: ap-south-2 (Asia Pacific - Hyderabad)
  Enterprise Edition: EventBridge Archive & Replay, SQS Dead-Letter Queues, and AWS X-Ray Tracing

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.12
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref IncidentsTable
        EVENT_BUS_NAME: !Ref EventBus
        SNS_TOPIC_ARN: !Ref AlertsTopic
        DEAD_LETTER_QUEUE_URL: !Ref ResQFlowDeadLetterQueue
        APP_REGION: !Ref "AWS::Region"

Resources:
  # ==========================================================
  # 1. DYNAMODB STORAGE LAYER
  # ==========================================================
  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ResQFlowIncidents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: incidentId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: incidentId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusCreatedAtIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      Tags:
        - Key: Project
          Value: ResQFlow

  # ==========================================================
  # 2. EVENT ROUTING & ARCHIVE LAYER (Amazon EventBridge)
  # ==========================================================
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: resqflow-event-bus

  ResQFlowEventArchive:
    Type: AWS::Events::Archive
    Properties:
      ArchiveName: ResQFlow-EventArchive
      SourceArn: !GetAtt EventBus.Arn
      Description: Comprehensive disaster event audit trail and replay archive
      RetentionDays: 14

  # ==========================================================
  # 3. FAULT TOLERANCE LAYER (Amazon SQS Dead-Letter Queue)
  # ==========================================================
  ResQFlowDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ResQFlow-DeadLetterQueue
      MessageRetentionPeriod: 1209600 # 14 days

  ResQFlowDeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ResQFlowDeadLetterQueue
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ResQFlowDeadLetterQueue.Arn

  # ==========================================================
  # 4. NOTIFICATION & AUDIT LAYER (Amazon SNS & Audit Queue)
  # ==========================================================
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: ResQFlowAlerts
      DisplayName: ResQFlow Emergency Response Alerts

  ResQFlowAlertAuditQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ResQFlow-AlertAuditQueue
      MessageRetentionPeriod: 1209600 # 14 days

  ResQFlowAlertAuditQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ResQFlowAlertAuditQueue
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - sns.amazonaws.com
                - events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ResQFlowAlertAuditQueue.Arn

  AlertsTopicToAuditQueueSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: sqs
      Endpoint: !GetAtt ResQFlowAlertAuditQueue.Arn
      RawMessageDelivery: false

  DispatchTelemetryRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref EventBus
      Name: ResQFlow-DispatchTelemetryRule
      Description: Captures ResourceAllocated, TeamDispatched, and IncidentResolved domain events
      EventPattern:
        source:
          - resqflow.incident
        detail-type:
          - ResourceAllocated
          - TeamDispatched
          - IncidentResolved
      Targets:
        - Id: DispatchAuditQueueTarget
          Arn: !GetAtt ResQFlowAlertAuditQueue.Arn

  # ==========================================================
  # 5. INGESTION API (Amazon API Gateway HTTP API)
  # ==========================================================
  ResQFlowHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: ResQFlow-IngestionApi
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Amz-Date
          - X-Api-Key
          - X-Amz-Security-Token
        MaxAge: 600

  # ==========================================================
  # 6. INGESTION LAMBDA FUNCTION
  # ==========================================================
  IngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ResQFlow-IngestionFunction
      CodeUri: ../backend/ingestion
      Handler: app.lambda_handler
      Description: Ingests emergency incidents, stores in DynamoDB, and emits IncidentReported
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentsTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ResQFlowDeadLetterQueue.QueueName
      Events:
        CreateIncident:
          Type: HttpApi
          Properties:
            ApiId: !Ref ResQFlowHttpApi
            Path: /incidents
            Method: POST
        ListIncidents:
          Type: HttpApi
          Properties:
            ApiId: !Ref ResQFlowHttpApi
            Path: /incidents
            Method: GET
        GetIncident:
          Type: HttpApi
          Properties:
            ApiId: !Ref ResQFlowHttpApi
            Path: /incidents/{incidentId}
            Method: GET
        TriggerDrill:
          Type: HttpApi
          Properties:
            ApiId: !Ref ResQFlowHttpApi
            Path: /incidents/drill
            Method: POST
        ResolveIncident:
          Type: HttpApi
          Properties:
            ApiId: !Ref ResQFlowHttpApi
            Path: /incidents/{incidentId}/resolve
            Method: POST

  # ==========================================================
  # 7. CLASSIFIER LAMBDA FUNCTION
  # ==========================================================
  ClassifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ResQFlow-ClassifierFunction
      CodeUri: ../backend/classifier
      Handler: app.lambda_handler
      Description: Classifies incident severity deterministically and emits IncidentClassified
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentsTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
      Events:
        IncidentReportedRule:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref EventBus
            Pattern:
              source:
                - resqflow.incident
              detail-type:
                - IncidentReported
            DeadLetterConfig:
              Arn: !GetAtt ResQFlowDeadLetterQueue.Arn

  # ==========================================================
  # 8. RESOURCE ALLOCATION LAMBDA FUNCTION
  # ==========================================================
  ResourceAllocationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ResQFlow-ResourceAllocationFunction
      CodeUri: ../backend/resource
      Handler: app.lambda_handler
      Description: Allocates response teams and hospital facilities based on severity
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentsTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus

  # ==========================================================
  # 9. NOTIFICATION LAMBDA FUNCTION
  # ==========================================================
  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ResQFlow-NotificationFunction
      CodeUri: ../backend/notification
      Handler: app.lambda_handler
      Description: Dispatches broadcast SMS/Email alerts via Amazon SNS
      Policies:
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertsTopic.TopicName

  # ==========================================================
  # 10. STEP FUNCTIONS ORCHESTRATION WORKFLOW
  # ==========================================================
  ResQFlowStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: ResQFlowIncidentWorkflow
      DefinitionUri: ../backend/statemachines/incident-workflow.asl.json
      DefinitionSubstitutions:
        ResourceAllocationFunctionArn: !GetAtt ResourceAllocationFunction.Arn
        NotificationFunctionArn: !GetAtt NotificationFunction.Arn
      Tracing:
        Enabled: true
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ResourceAllocationFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref NotificationFunction
      Events:
        IncidentClassifiedRule:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref EventBus
            Pattern:
              source:
                - resqflow.incident
              detail-type:
                - IncidentClassified
            DeadLetterConfig:
              Arn: !GetAtt ResQFlowDeadLetterQueue.Arn

Outputs:
  ApiEndpoint:
    Description: Base HTTP API Endpoint for ResQFlow
    Value: !Sub "https://${ResQFlowHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
    Export:
      Name: ResQFlow-ApiEndpoint

  IncidentsTableName:
    Description: DynamoDB Table Name
    Value: !Ref IncidentsTable
    Export:
      Name: ResQFlow-IncidentsTableName

  EventBusArn:
    Description: ResQFlow Custom EventBus ARN
    Value: !GetAtt EventBus.Arn
    Export:
      Name: ResQFlow-EventBusArn

  EventArchiveArn:
    Description: ResQFlow EventBridge Archive ARN
    Value: !GetAtt ResQFlowEventArchive.Arn
    Export:
      Name: ResQFlow-EventArchiveArn

  DeadLetterQueueUrl:
    Description: SQS Dead-Letter Queue URL for Circuit Breaker Fault Recovery
    Value: !Ref ResQFlowDeadLetterQueue
    Export:
      Name: ResQFlow-DeadLetterQueueUrl

  DeadLetterQueueArn:
    Description: SQS Dead-Letter Queue ARN
    Value: !GetAtt ResQFlowDeadLetterQueue.Arn
    Export:
      Name: ResQFlow-DeadLetterQueueArn

  AlertsTopicArn:
    Description: ResQFlow SNS Alerts Topic ARN
    Value: !Ref AlertsTopic
    Export:
      Name: ResQFlow-AlertsTopicArn

  AlertAuditQueueUrl:
    Description: SQS Queue URL capturing SNS emergency broadcasts and EventBridge dispatch telemetry
    Value: !Ref ResQFlowAlertAuditQueue
    Export:
      Name: ResQFlow-AlertAuditQueueUrl

  AlertAuditQueueArn:
    Description: SQS Queue ARN capturing SNS emergency broadcasts and EventBridge dispatch telemetry
    Value: !GetAtt ResQFlowAlertAuditQueue.Arn
    Export:
      Name: ResQFlow-AlertAuditQueueArn

  StateMachineArn:
    Description: ResQFlow Step Functions Orchestrator ARN
    Value: !Ref ResQFlowStateMachine
    Export:
      Name: ResQFlow-StateMachineArn
